<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 616" width="460" height="616" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Abstract coral halftone collage of a wing-like form</title>
  <defs>
    <pattern id="dotsFine" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1" fill="#e8624f"/>
    </pattern>
    <pattern id="dotsMed" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="2.4" fill="#e8624f"/>
    </pattern>
    <pattern id="dotsLarge" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4.6" fill="#e8624f"/>
    </pattern>
    <pattern id="dotsFineCream" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1" fill="#f9dcd2"/>
    </pattern>
    <pattern id="linesH" width="1" height="6" patternUnits="userSpaceOnUse">
      <rect width="1" height="2.4" fill="#fbe7de"/>
    </pattern>
    <pattern id="linesV" width="6" height="1" patternUnits="userSpaceOnUse">
      <rect width="2.4" height="1" fill="#f9dcd2"/>
    </pattern>

    <linearGradient id="fadeLR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeTB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fadeRad" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <mask id="maskLR"><rect width="460" height="616" fill="url(#fadeLR)"/></mask>
    <mask id="maskTB"><rect width="460" height="616" fill="url(#fadeTB)"/></mask>
    <mask id="maskRad"><rect width="460" height="616" fill="url(#fadeRad)"/></mask>

    <path id="wingShape" d="M118 232
      C 70 300, 60 400, 92 486
      C 112 540, 150 566, 196 566
      C 226 566, 246 546, 250 512
      C 254 476, 236 452, 230 420
      C 260 452, 300 466, 336 452
      C 372 438, 388 402, 376 366
      C 402 380, 428 372, 438 344
      C 448 316, 434 288, 404 280
      C 420 260, 418 232, 396 216
      C 372 198, 342 206, 328 228
      C 320 196, 292 176, 260 182
      C 232 188, 214 212, 216 240
      C 190 224, 158 224, 132 244
      Z"/>

    <clipPath id="wingClip">
      <use href="#wingShape"/>
    </clipPath>
  </defs>

  <rect width="460" height="616" fill="#fbe9e1"/>

  <rect x="0" y="0" width="106" height="386" fill="#e8624f"/>
  <rect x="0" y="386" width="106" height="230" fill="#e8624f"/>
  <rect x="0" y="470" width="106" height="146" fill="#d9503d"/>

  <rect x="106" y="0" width="176" height="230" fill="url(#dotsFine)"/>
  <rect x="106" y="0" width="176" height="230" fill="url(#dotsMed)" mask="url(#maskLR)"/>

  <rect x="282" y="0" width="178" height="230" fill="#fbe9e1"/>
  <rect x="282" y="0" width="178" height="230" fill="url(#dotsLarge)" mask="url(#maskRad)"/>

  <rect x="330" y="352" width="130" height="120" fill="#e8624f"/>
  <rect x="330" y="352" width="130" height="120" fill="url(#linesH)"/>

  <rect x="330" y="472" width="130" height="144" fill="#d9503d"/>
  <rect x="330" y="472" width="130" height="144" fill="url(#linesV)"/>

  <rect x="106" y="472" width="224" height="144" fill="#fbe9e1"/>
  <rect x="106" y="472" width="224" height="144" fill="url(#dotsFine)" mask="url(#maskTB)"/>

  <g clip-path="url(#wingClip)">
    <rect x="40" y="150" width="420" height="440" fill="#fbe9e1"/>
    <rect x="40" y="150" width="420" height="440" fill="url(#dotsFine)"/>
    <rect x="40" y="150" width="210" height="440" fill="url(#dotsMed)"/>
    <rect x="40" y="150" width="130" height="440" fill="url(#dotsLarge)"/>
    <rect x="40" y="150" width="420" height="150" fill="url(#dotsLarge)"/>
    <path d="M150 260 C 130 340, 140 430, 190 500" stroke="#fbe9e1" stroke-width="10" fill="none"/>
    <path d="M200 260 C 190 340, 200 440, 240 510" stroke="#fbe9e1" stroke-width="6" fill="none"/>
    <path d="M260 250 C 300 280, 340 300, 380 290" stroke="#fbe9e1" stroke-width="6" fill="none"/>
    <path d="M270 290 C 320 320, 370 330, 410 310" stroke="#fbe9e1" stroke-width="5" fill="none"/>
  </g>
  <use href="#wingShape" fill="none" stroke="#fbe9e1" stroke-width="1.5" opacity="0.4"/>

  <rect x="106" y="230" width="176" height="6" fill="#fbe9e1"/>
  <rect x="282" y="230" width="178" height="6" fill="#fbe9e1"/>
  <rect x="0" y="386" width="106" height="4" fill="#fbe9e1"/>
</svg>
