<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Humanist Review of AI</title>
  <style>
    @font-face {
      font-family: 'ET Bembo';
      src: url('fonts/ETBembo-RomanOSF.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ET Bembo';
      src: url('fonts/ETBembo-SemiBoldOSF.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ET Bembo';
      src: url('fonts/ETBembo-DisplayItalic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: 'ET Bembo Lining';
      src: url('fonts/ETBembo-RomanLF.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --sepia-frame: #e6d6b8;
      --sepia: #a98a5c;
      --sepia-dark: #8a6d42;
      --cream: #f8f4ee;
      --ink: #000000;
      --ink-soft: #4a4540;
      --rule: #e4ddd3;
      --serif: 'ET Bembo', Bembo, 'Times New Roman', Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--sepia-frame);
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      background: var(--sepia-frame);
      padding: 125px 100px 0;
      font-family: var(--serif);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      background: var(--cream);
      border-radius: 14px 14px 0 0;
      min-height: calc(100vh - 125px);
      overflow: hidden;
    }

    .site-title {
      position: absolute;
      top: 50px;
      right: 40px;
      font-family: var(--serif);
      font-size: 30px;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }

    .site-title:hover {
      color: var(--sepia-dark);
    }

    html {
      scrollbar-width: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    .scroll-progress-track {
      position: fixed;
      top: 0;
      right: 0;
      width: 8px;
      height: 100%;
      background: rgba(0, 0, 0, 0.08);
      z-index: 40;
    }

    .scroll-progress-fill {
      position: fixed;
      top: 0;
      right: 0;
      width: 8px;
      height: 0%;
      background: #000000;
      z-index: 41;
    }

    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 42;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-top-btn svg {
      width: 26px;
      height: 26px;
    }
  </style>
</head>
<body>
  <a class="site-title" href="index.html">Global Maxima</a>

  <div class="scroll-progress-track"></div>
  <div class="scroll-progress-fill"></div>

  <button class="scroll-top-btn" type="button" aria-label="Scroll to top">
    <svg viewBox="0 0 26 26" fill="none" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="13,4 23,21 3,21"/>
    </svg>
  </button>

  <div class="page">
    <header class="site-header"></header>

    <main>
    </main>
  </div>

  <script>
    (function () {
      var fill = document.querySelector('.scroll-progress-fill');
      var btn = document.querySelector('.scroll-top-btn');

      function update() {
        var doc = document.documentElement;
        var scrollTop = doc.scrollTop || document.body.scrollTop;
        var scrollable = doc.scrollHeight - doc.clientHeight;
        var pct = scrollable > 0 ? Math.min(100, (scrollTop / scrollable) * 100) : 0;
        fill.style.height = pct + '%';
        btn.classList.toggle('visible', scrollTop > window.innerHeight);
      }

      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();

      btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();
  </script>
</body>
</html>
