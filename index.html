<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Humanist Review of AI</title>
  <style>
    @font-face {
      font-family: 'ET Bembo';
      src: url('fonts/ETBembo-RomanOSF.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ET Bembo';
      src: url('fonts/ETBembo-SemiBoldOSF.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ET Bembo';
      src: url('fonts/ETBembo-DisplayItalic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: 'ET Bembo Lining';
      src: url('fonts/ETBembo-RomanLF.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --jade-frame: #3f8f72;
      --jade: #2b7a5c;
      --jade-dark: #1e5c45;
      --cream: #f8f4ee;
      --ink: #1c1a17;
      --ink-soft: #4a4540;
      --rule: #e4ddd3;
      --serif: 'ET Bembo', Bembo, 'Times New Roman', Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--jade-frame);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--jade-frame);
      padding: 8px;
      font-family: var(--serif);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      background: var(--cream);
      border-radius: 14px;
      min-height: calc(100vh - 16px);
      overflow: hidden;
    }

    .site-header {
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header"></header>

    <main>
    </main>
  </div>
</body>
</html>
